[project]
name = "budget_smart_travel_planning_system"
version = "0.1.0"
description = "budget_smart_travel_planning_system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "browserbase",
    "crewai-tools[serpapi]>=1.14.4",
    "crewai[file-processing,litellm,tools]==1.14.4",
    "firecrawl-py",
    "serpapi",
    "stagehand<=0.5.9",
]

[project.scripts]
travel_planner_crew = "budget_smart_travel_planning_system.main:run"
run_crew = "budget_smart_travel_planning_system.main:run"
train = "budget_smart_travel_planning_system.main:train"
replay = "budget_smart_travel_planning_system.main:replay"
test = "budget_smart_travel_planning_system.main:test"
run_with_trigger = "budget_smart_travel_planning_system.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/budget_smart_travel_planning_system"]
